
<h2>Course Management</h2>

<button (click)="addCourse()">
  Add Course
</button>

<table border="1" cellpadding="10">
  <thead>
    <tr>
      <th>Course Id</th>
      <th>Course Code</th>
      <th>Course Name</th>
      <th>Description</th>
      <th>Duration</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let course of courses">
      <td>{{course.id}}</td>
      <td>{{course.courseCode}}</td>
      <td>{{course.courseName}}</td>
      <td>{{course.description}}</td>
      <td>{{course.duration}}</td>
      <td>{{course.status}}</td>
      <td>
        <button (click)="editCourse(course.id!)">
          Edit
        </button>

        <button (click)="deleteCourse(course.id!)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<app-course-form
  *ngIf="showForm"
  [courseId]="selectedCourseId"
  (courseSaved)="onCourseSaved()"
  (cancelled)="onCourseCancelled()">
</app-course-form>
